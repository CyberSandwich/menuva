<style>
html{scroll-behavior:smooth;overflow-y:scroll;background:var(--bg)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.wrap{

@keyframes heroIn{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:none}
}
.hero-text{
  display:block;
  max-width:280px;
  width:70%;
  height:auto;
  margin:40px auto 64px;
  user-select:none;
  -webkit-user-drag:none;
  cursor:pointer;
  animation:heroIn .5s cubic-bezier(.25,.46,.45,.94) .1s both
}
.hero-phone{
  display:block;
  max-width:400px;

  -webkit-user-drag:none;
  cursor:pointer;
  animation:heroIn .5s cubic-bezier(.25,.46,.45,.94) .25s both
}

.links{
  max-width:400px;
  margin:0 auto 14px;
  background:var(--card);
  border-radius:20px;
  box-shadow:var(--shadow);
  overflow:hidden
}
.links a{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 20px;
  font-size:.9375rem;
  font-weight:500;
  color:var(--t2);
  text-decoration:none;
  transition:background .15s,color .15s;
  border-bottom:1px solid var(--bdr2)
}
.links a:last-child{border-bottom:none}
@media(hover:hover){.links a:hover{background:var(--bg2);color:var(--t1)}}
.links svg{width:18px;height:18px;flex-shrink:0;color:var(--t4)}
.copy-row{display:flex;align-items:center;border-bottom:1px solid var(--bdr2);transition:background .15s}
@media(hover:hover){.copy-row:hover{background:var(--bg2)}.copy-row:hover a{color:var(--t1)}}
.copy-row a{flex:1;min-width:0;border-bottom:none}
@media(hover:hover){.copy-row a:hover{background:none}}
.links>.copy-row:last-child{border-bottom:none}
.copy-btn{
  padding:8px 16px;
  margin-right:14px;
  border:1.5px solid var(--bdr);
  border-radius:var(--rr);
  background:none;
  font:500 .75rem/1 var(--font);
  color:var(--t3);
  cursor:pointer;
  flex-shrink:0;
  min-width:58px;
  text-align:center;
  transition:background .2s ease,color .2s ease,border-color .2s ease,opacity .2s ease
}
@media(hover:hover){.copy-btn:hover{background:var(--bg2);color:var(--t2);border-color:var(--t4)}}
.copy-btn.copied{background:#DCFCE7;color:#34D399;border-color:#A7F3D0;animation:copyPop .35s ease}
.copy-btn.copied svg{width:14px;height:14px;display:block;margin:0 auto}
.copy-btn.copied polyline{stroke-dasharray:24;stroke-dashoffset:24;animation:checkDraw .35s ease .08s forwards}
@keyframes copyPop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes checkDraw{to{stroke-dashoffset:0}}

.qr-overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;
  transition:opacity .2s,visibility .2s;
  outline:none
}
@supports(backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){
  .qr-overlay{backdrop-filter:blur(12px) saturate(1.4);-webkit-backdrop-filter:blur(12px) saturate(1.4);background:rgba(0,0,0,.18)}
}
.qr-overlay.open{opacity:1;visibility:visible}
.qr-card{
  background:#fff;
  border-radius:20px;
  padding:24px;overflow:hidden;
  width:min(340px,80vmin);aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 40px rgba(0,0,0,.16),0 2px 12px rgba(0,0,0,.08);
  transform:scale(.92);opacity:0;
  transition:transform .2s cubic-bezier(.2,.9,.3,1),opacity .2s;
  cursor:pointer
}
.qr-overlay.open .qr-card{transform:scale(1);opacity:1}
.qr-card img{width:100%;height:auto;display:block;image-rendering:crisp-edges;image-rendering:pixelated}

<script type="module">
import { initCommandPalette, initKeyboard, initLanguage, registerStrings, chrome } from '/js/shared.js?v=10';

registerStrings({
  en:{dlBtn:'Download on the App Store',dlTitle:'Download menuva on the App Store',giveFeedback:'Give Feedback',copyLabel:'Copy',copyEmail:'Copy Email Address',copyFeedback:'Copy Feedback Link',sendEmail:'Send email',feedbackTitle:'Give feedback',heroTextAlt:'menuva - your digital menu platform',heroPhoneAlt:'menuva app showing map view of nearby restaurants'},
  zh:{dlBtn:'在 App Store 下载',dlTitle:'在 App Store 下载 menuva',giveFeedback:'意见反馈',copyLabel:'复制',copyEmail:'复制邮箱地址',copyFeedback:'复制反馈链接',sendEmail:'发送邮件',feedbackTitle:'意见反馈',heroTextAlt:'menuva - 您的智能点餐平台',heroPhoneAlt:'menuva 应用展示附近餐厅地图'}
});

// ==================== COPY ====================

var CHECK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"/></svg>';

function makeCheck(){
  var parser=new DOMParser();
  var doc=parser.parseFromString(CHECK_SVG,'text/html');
  return doc.body.firstChild;
}

document.addEventListener('click',function(e){
  var btn=e.target.closest('.copy-btn');
  if(!btn)return;
  var text=btn.getAttribute('data-copy');
  if(!text)return;
  e.preventDefault();
  function done(){
    clearTimeout(btn._t1);clearTimeout(btn._t2);
    btn.classList.add('copied');
    btn.textContent='';
    var svg=makeCheck();
    if(svg)btn.appendChild(svg);
    btn._t1=setTimeout(function(){
      btn.style.opacity='0';
      btn._t2=setTimeout(function(){
        btn.classList.remove('copied');
        btn.textContent=chrome('copyLabel');
        btn.style.opacity='';
      },200);
    },1500);
  }
  function legacy(){
    var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);done();
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){try{legacy()}catch(e){}});
  }else{try{legacy()}catch(e){}}
});

// ==================== QR OVERLAY ====================

var qrOverlay=document.createElement('div');qrOverlay.className='qr-overlay';
qrOverlay.setAttribute('role','dialog');qrOverlay.setAttribute('aria-modal','true');qrOverlay.setAttribute('aria-label','QR Code');
qrOverlay.tabIndex=-1;
var qrCard=document.createElement('div');qrCard.className='qr-card';
var qrImg=document.createElement('img');qrImg.alt='QR code to menuva.co.uk';qrImg.width=23;qrImg.height=23;
qrCard.appendChild(qrImg);qrOverlay.appendChild(qrCard);document.body.appendChild(qrOverlay);

var qrOpen=false;
function openQR(){
  if(qrOpen)return;
  if(cmd&&cmd.isOpen())cmd.close();
  if(!qrImg.src)qrImg.src='/qr.png?v=10';
  qrOpen=true;
  document.body.style.overflow='hidden';
  qrOverlay.classList.add('open');
  qrOverlay.focus();
}
function closeQR(){
  if(!qrOpen)return;
  qrOpen=false;
  document.body.style.overflow='';
  qrOverlay.classList.remove('open');
}

var heroLogo=document.querySelector('.hero-text');
if(heroLogo)heroLogo.addEventListener('click',function(){openQR()});

var heroPhone=document.querySelector('.hero-phone');
if(heroPhone)heroPhone.addEventListener('click',function(){window.open('https://apps.apple.com/us/app/menuva/id6756895068','_blank')});

qrOverlay.addEventListener('click',function(e){
  if(e.target===qrOverlay)closeQR();
});
qrOverlay.addEventListener('keydown',function(e){if(e.key==='Escape')closeQR()});
qrCard.addEventListener('click',function(){
  closeQR();
  if(cmd)cmd.open();
});

// ==================== SHARED MODULE INIT ====================

var cmd=initCommandPalette({
  buildItems:function(){
    return [
      {q:'home',tl:'home',title:chrome('home'),type:'Page',act:function(){window.scrollTo(0,0)}},
      {q:'menus',tl:'menus',title:chrome('menus'),type:'Page',act:function(){location.href='/menus/'}},
      {q:'more',tl:'more',title:chrome('more'),type:'Page',act:function(){location.href='/more/'}}
    ];
  },
  typePri:{Page:4},
  maxResults:8,
  onBeforeOpen:function(){if(qrOpen)closeQR()}
});

initLanguage({
  onApply:function(lng){
    var suffix=lng==='zh'?'zh':'en';

    var heroText=document.querySelector('.hero-text');
    if(heroText){heroText.src='/hero-text-'+suffix+'.png?v=10';heroText.alt=chrome('heroTextAlt')}
    var heroPhone=document.querySelector('.hero-phone');
    if(heroPhone){heroPhone.src='/hero-phone-'+suffix+'.png?v=10';heroPhone.alt=chrome('heroPhoneAlt')}

    var dlLink=document.querySelector('.dl-link a');
    if(dlLink){
      var svg=dlLink.querySelector('svg');
      dlLink.textContent=chrome('dlBtn');
      if(svg)dlLink.prepend(svg);
      dlLink.title=chrome('dlTitle');
    }

    var rows=document.querySelectorAll('.copy-row');
    if(rows[0]){
      var a0=rows[0].querySelector('a');if(a0)a0.title=chrome('sendEmail');
      var b0=rows[0].querySelector('.copy-btn');if(b0&&!b0.classList.contains('copied')){b0.textContent=chrome('copyLabel');b0.setAttribute('aria-label',chrome('copyEmail'))}
    }
    if(rows[1]){
      var a1=rows[1].querySelector('a');
      if(a1){
        var svg1=a1.querySelector('svg');
        a1.textContent=chrome('giveFeedback');
        if(svg1)a1.prepend(svg1);
        a1.title=chrome('feedbackTitle');
      }
      var b1=rows[1].querySelector('.copy-btn');if(b1&&!b1.classList.contains('copied')){b1.textContent=chrome('copyLabel');b1.setAttribute('aria-label',chrome('copyFeedback'))}
    }
  }
});

initKeyboard({
  CUR_TAB:0,
  searchInputId:null,
  cardSelector:null,
  modalGuards:function(){
    if(qrOpen)return true;
    return false;
  },
  onKey:function(key,e){return false}
});
</script>
