name: Generate Pages

on:
  push:
    branches: [main]
    paths:
      - '_config/**'
      - '_templates/**'
      - 'content/**'
      - 'js/md.js'
      - '.github/scripts/generate.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate pages
        run: node .github/scripts/generate.js

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet && git diff --cached --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: generate pages from config [skip ci]"
          git push
