<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Redirecting</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAFAFA">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/png" href="/favicon.png?v=16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=16">
<link rel="preconnect" href="https://www.googletagmanager.com" crossorigin>
<link rel="preconnect" href="https://www.google-analytics.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<style>
:root{--bg:#FAFAFA;--card:#FFF;--t1:#1A1A1A;--t2:#6B6B6B;--t3:#9A9A9A;--t4:#C7C7CC;--bdr:#E8E8E8;--bdr2:#F0F0F0;--acc:#12B3A8;--shadow:0 1px 3px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--t1);display:flex;flex-direction:column;align-items:center;min-height:100vh;min-height:100dvh;padding:32px 24px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;line-height:1.5}
main{flex:1;display:flex;align-items:center;justify-content:center;width:100%;max-width:360px}
.card{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:56px 36px 44px;text-align:center;width:100%;animation:cardin .5s cubic-bezier(.25,.46,.45,.94) both}
@keyframes cardin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.icon{width:76px;height:76px;margin:0 auto 28px;border-radius:24px;background:rgba(18,179,168,.08);color:var(--acc);display:grid;place-items:center;position:relative}
.icon svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:1.375rem;font-weight:600;letter-spacing:-.024em;margin-bottom:20px;color:var(--t1)}
.loader{width:56px;height:2px;margin:0 auto;background:var(--bdr2);border-radius:2px;overflow:hidden;position:relative}
.loader::before{content:'';position:absolute;inset:0;width:40%;background:var(--acc);border-radius:2px;animation:sweep 1.5s cubic-bezier(.4,0,.2,1) infinite}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.action{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:16px;padding:28px 0 max(8px,env(safe-area-inset-bottom));opacity:0;animation:fadein .6s ease-out 1s forwards}
@keyframes fadein{to{opacity:1}}
.btn{display:inline-block;padding:11px 26px;background:transparent;color:var(--t2);border:1.5px solid var(--bdr);border-radius:50px;text-decoration:none;font-weight:500;font-size:.875rem;letter-spacing:-.005em;transition:color .15s,border-color .15s,background .15s}
@media(hover:hover){.btn:hover{color:var(--t1);border-color:var(--t3);background:var(--card)}}
.btn:active{color:var(--t1);border-color:var(--t2)}
.support{display:none;font-size:.8125rem;color:var(--t3);letter-spacing:-.005em}
.support a{color:var(--t2);text-decoration:none;border-bottom:1px solid var(--bdr);padding-bottom:1px;transition:color .15s,border-color .15s}
@media(hover:hover){.support a:hover{color:var(--t1);border-bottom-color:var(--t3)}}
.support.show{display:block}
@media(prefers-reduced-motion:reduce){.loader::before{animation:none;width:100%;opacity:.4}.card{animation:none}.action{animation:none;opacity:1}.btn{transition:none}}
</style>
<script>try{if(localStorage.getItem('lang')==='zh')document.documentElement.lang='zh-Hans'}catch(_){}</script>
<script>
(function(){
  var p=location.pathname.replace(/\/+$/,'');

  /* --- Tier 1: Known pages (instant, no GA4) --- */
  if(p==='/promo'||p.indexOf('/promo/')===0){location.replace('/promo/');return}
  if(p==='/accessibility'||p.indexOf('/accessibility/')===0){location.replace('/accessibility/');return}
  if(p==='/join'||p.indexOf('/join/')===0){location.replace('/join/');return}
  if(p==='/partners'||p.indexOf('/partners/')===0){location.replace('/join/');return}
  if(p==='/tutorial'||p.indexOf('/tutorial/')===0){location.replace('/tutorial/');return}
  if(p==='/contact'||p.indexOf('/contact/')===0){location.replace('/contact/');return}
  if(p==='/faq'||p.indexOf('/faq/')===0){location.replace('/faq/');return}
  if(p==='/privacy'||p.indexOf('/privacy/')===0){location.replace('/privacy/');return}
  if(p==='/terms'||p.indexOf('/terms/')===0){location.replace('/terms/');return}
  if(p==='/support'||p.indexOf('/support/')===0){location.replace('/contact/');return}
  if(p==='/links'||p.indexOf('/links/')===0){location.replace('/more/');return}
  if(p==='/more'||p.indexOf('/more/')===0){location.replace('/more/');return}
  if(p.indexOf('/menus/')===0||p==='/menus'){
    var parts=p.replace('/menus','').replace(/^\//,'').split('/').filter(Boolean);
    if(parts.length>=1){
      try{sessionStorage.setItem('_menuPrefetch',parts[0])}catch(_){}
      var url='/menus/?slug='+encodeURIComponent(parts[0]);
      if(parts[1])url+='&loc='+encodeURIComponent(parts[1]);
      location.replace(url)
    }else{location.replace('/menus/')}
    return
  }

  var slug=p.replace(/^\//,'');

  /* --- Redirect config: slug -> destination --- */
  var R={
    ar:"/",bb:"/",cc:"/",cv:"/",jm:"/",ls:"/",rt:"/",sb:"/",
    card:"/",sport:"/",students:"/",
    instagram:"/menus/",linkedin:"/menus/",piazza:"/menus/",
    society:"/menus/",wbs:"/menus/",aboard:"/menus/",
    sign:"/menus/",banner:"/menus/",flyer:"/menus/",lecture:"/menus/",
    download:"https://apps.apple.com/us/app/menuva/id6756895068",
    beta:"https://testflight.apple.com/join/y6cwz9Qm",
    feedback:"https://docs.google.com/forms/d/e/1FAIpQLSeZRJYK2gEEBXD-C-Ub8LzEIjZXNjissO3IXiFIQ6J4z0_-WA/viewform"
  };
  var T={
    ar:"westwood",bb:"bluebell",cc:"claycroft & tocil",
    cv:"benefactors & cryfield",jm:"arthur vick & jack martin",
    ls:"heronbank & lakeside",rt:"rootes",sb:"sherbourne"
  };

  var MID='G-LLFDHVYBWL';

  var _denied=false;
  try{_denied=localStorage.getItem('analytics_consent')==='denied'}catch(_){}

  function loadGA(debug){
    if(_denied)return;
    var s=document.createElement('script');
    s.async=true;
    s.src='https://www.googletagmanager.com/gtag/js?id='+MID;
    document.head.appendChild(s);
    window.dataLayer=window.dataLayer||[];
    window.gtag=function(){dataLayer.push(arguments)};
    gtag('js',new Date());
    gtag('config',MID,{send_page_view:false,anonymize_ip:true,debug_mode:debug});
  }

  /* Lucide icon paths (inner SVG only) */
  var ICONS={
    compass:'<circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/>',
    ext:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
    q:'<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>'
  };

  function swapIcon(el,key){
    var svgDoc=new DOMParser().parseFromString(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">'+ICONS[key]+'</svg>',
      'image/svg+xml'
    );
    el.textContent='';
    el.appendChild(document.importNode(svgDoc.documentElement,true));
  }

  function render(o){
    function go(){
      var ic=document.getElementById('msg-icon');
      if(ic&&o.icon)swapIcon(ic,o.icon);
      var h=document.getElementById('msg-title');
      if(h&&o.title)h.textContent=o.title;
      var link=document.getElementById('msg-link');
      if(link){
        if(o.href)link.href=o.href;
        if(o.linkText)link.textContent=o.linkText;
      }
      var ldr=document.getElementById('msg-loader');
      if(ldr&&o.hideLoader)ldr.style.display='none';
      var sup=document.getElementById('msg-support');
      if(sup&&o.support)sup.classList.add('show');
    }
    if(document.body)go();
    else document.addEventListener('DOMContentLoaded',go,{once:true});
  }

  var dest=R[slug];

  if(dest!==undefined){
    /* --- Tier 2: Redirect slug --- */
    var ext=dest.indexOf('https://')===0;
    var params=new URLSearchParams(location.search);
    var debug=params.get('debug_mode')==='true';
    var title=T[slug]||slug;
    var toUrl;

    if(ext){
      toUrl=dest;
    }else{
      if(!params.has('qr_source'))params.set('qr_source',slug);
      if(!params.has('from'))params.set('from',slug);
      var u=new URL(dest,location.origin);
      u.search=params.toString();
      toUrl=u.toString();
    }

    document.title='menuva | '+title;

    var heading,iconKey;
    if(ext&&dest.indexOf('testflight')!==-1){
      heading='Opening TestFlight';iconKey='ext';
    }else if(ext&&dest.indexOf('apps.apple.com')!==-1){
      heading='Opening the App Store';iconKey='ext';
    }else if(ext){
      heading='Opening Link';iconKey='ext';
    }else{
      heading='Redirecting';iconKey='compass';
    }

    render({icon:iconKey,title:heading,href:ext?dest:toUrl,linkText:'Tap to continue'});

    function doRedirect(){window.location.replace(toUrl)}

    if(_denied){doRedirect();return}

    loadGA(debug);

    gtag('event','page_view',{
      page_title:'menuva | '+title,
      page_location:location.href,
      page_path:'/'+slug
    });

    if(ext){
      gtag('event','redirect_hit',{
        transport_type:'beacon',
        event_callback:doRedirect,
        event_timeout:1200,
        from_path:params.get('from')?('/'+String(params.get('from')).replace(/^\/+/,'')):(''),
        to_url:toUrl,
        qr_source:params.get('qr_source')||'',
        qr_id:params.get('qr_id')||'',
        utm_source:params.get('utm_source')||'',
        utm_medium:params.get('utm_medium')||'',
        utm_campaign:params.get('utm_campaign')||'',
        referrer:document.referrer||''
      });
    }else{
      gtag('event','redirect_hit',{
        transport_type:'beacon',
        event_callback:doRedirect,
        event_timeout:1200,
        from_path:'/'+slug,
        to_path:dest,
        to_url:toUrl,
        qr_source:params.get('qr_source')||slug,
        qr_id:params.get('qr_id')||'',
        utm_source:params.get('utm_source')||'',
        utm_medium:params.get('utm_medium')||'',
        utm_campaign:params.get('utm_campaign')||'',
        referrer:document.referrer||''
      });
    }

    setTimeout(doRedirect,1200);
    return
  }

  /* --- Tier 3: Menu slug fallback (single path segment, no dots) --- */
  if(slug&&slug.indexOf('/')===-1&&slug.indexOf('.')===-1){
    location.replace('/menus/?slug='+encodeURIComponent(slug));
    return
  }

  /* --- Tier 4: True 404 --- */
  var params4=new URLSearchParams(location.search);
  var debug4=params4.get('debug_mode')==='true';

  document.title='menuva | 404';
  render({icon:'q',title:'Page Not Found',href:'/',linkText:'Go to Homepage',support:true,hideLoader:true});

  function doRedirect4(){window.location.replace('/')}

  if(_denied){doRedirect4();return}

  loadGA(debug4);

  gtag('event','page_view',{
    page_title:'menuva | 404',
    page_location:location.href,
    page_path:p||'/'
  });

  gtag('event','not_found',{
    transport_type:'beacon',
    event_callback:doRedirect4,
    event_timeout:1200,
    from_path:p||location.pathname,
    to_path:'/',
    to_url:location.origin+'/',
    referrer:document.referrer||''
  });

  setTimeout(doRedirect4,1200);
})();
</script>
</head>
<body>
<main>
  <div class="card">
    <div id="msg-icon" class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/></svg></div>
    <h1 id="msg-title">Redirecting</h1>
    <div id="msg-loader" class="loader" aria-hidden="true"></div>
  </div>
</main>
<div class="action">
  <a id="msg-link" class="btn" href="/">Tap to continue</a>
  <p id="msg-support" class="support">Something broken? <a href="mailto:support@menuva.co.uk">support@menuva.co.uk</a></p>
</div>
</body>
</html>
