<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Redirecting</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAFAFA">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/png" href="/favicon.png?v=16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=16">
<link rel="preconnect" href="https://www.googletagmanager.com" crossorigin>
<link rel="preconnect" href="https://www.google-analytics.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<style>
:root{--bg:#FAFAFA;--card:#FFF;--t1:#1A1A1A;--t2:#6B6B6B;--t3:#9A9A9A;--t4:#C7C7CC;--bdr:#E8E8E8;--acc:#12B3A8;--shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04);--shadow-hover:0 2px 8px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08);--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--t1);display:grid;place-items:center;min-height:100vh;min-height:100dvh;padding:24px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;line-height:1.5}
main{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.pcard{display:flex;align-items:center;gap:16px;padding:18px 20px;width:100%;background:var(--card);border-radius:20px;box-shadow:var(--shadow);text-decoration:none;color:var(--t1);transition:box-shadow .15s,transform .1s;animation:cardin .5s cubic-bezier(.25,.46,.45,.94) both}
@keyframes cardin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(hover:hover){.pcard:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}}
.pcard:active{transform:translateY(-1px) scale(.985)}
.picon{width:44px;height:44px;border-radius:14px;background:rgba(18,179,168,.08);color:var(--acc);display:grid;place-items:center;flex-shrink:0}
.picon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.pinf{flex:1;min-width:0}
.pt{font-size:1.0625rem;font-weight:600;letter-spacing:-.01em;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd{font-size:.8125rem;color:var(--t3);margin-top:3px;letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arr{color:var(--t4);flex-shrink:0;display:grid;place-items:center}
.arr svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pcard.support{display:none;opacity:0}
.pcard.support.show{display:flex;animation:fadein .6s ease-out 1s forwards}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.pcard{animation:none}.pcard.support.show{animation:none;opacity:1;transform:none}}
</style>
<script>try{if(localStorage.getItem('lang')==='zh')document.documentElement.lang='zh-Hans'}catch(_){}</script>
<script>
(function(){
  var p=location.pathname.replace(/\/+$/,'');

  /* --- Tier 1: Known pages (instant, no GA4) --- */
  if(p==='/promo'||p.indexOf('/promo/')===0){location.replace('/promo/');return}
  if(p==='/accessibility'||p.indexOf('/accessibility/')===0){location.replace('/accessibility/');return}
  if(p==='/join'||p.indexOf('/join/')===0){location.replace('/join/');return}
  if(p==='/partners'||p.indexOf('/partners/')===0){location.replace('/join/');return}
  if(p==='/tutorial'||p.indexOf('/tutorial/')===0){location.replace('/tutorial/');return}
  if(p==='/contact'||p.indexOf('/contact/')===0){location.replace('/contact/');return}
  if(p==='/faq'||p.indexOf('/faq/')===0){location.replace('/faq/');return}
  if(p==='/privacy'||p.indexOf('/privacy/')===0){location.replace('/privacy/');return}
  if(p==='/terms'||p.indexOf('/terms/')===0){location.replace('/terms/');return}
  if(p==='/support'||p.indexOf('/support/')===0){location.replace('/contact/');return}
  if(p==='/links'||p.indexOf('/links/')===0){location.replace('/more/');return}
  if(p==='/more'||p.indexOf('/more/')===0){location.replace('/more/');return}
  if(p.indexOf('/menus/')===0||p==='/menus'){
    var parts=p.replace('/menus','').replace(/^\//,'').split('/').filter(Boolean);
    if(parts.length>=1){
      try{sessionStorage.setItem('_menuPrefetch',parts[0])}catch(_){}
      var url='/menus/?slug='+encodeURIComponent(parts[0]);
      if(parts[1])url+='&loc='+encodeURIComponent(parts[1]);
      location.replace(url)
    }else{location.replace('/menus/')}
    return
  }

  var slug=p.replace(/^\//,'');

  /* --- Redirect config: slug -> destination --- */
  var R={
    ar:"/",bb:"/",cc:"/",cv:"/",jm:"/",ls:"/",rt:"/",sb:"/",
    card:"/",sport:"/",students:"/",
    instagram:"/menus/",linkedin:"/menus/",piazza:"/menus/",
    society:"/menus/",wbs:"/menus/",aboard:"/menus/",
    sign:"/menus/",banner:"/menus/",flyer:"/menus/",lecture:"/menus/",
    download:"https://apps.apple.com/us/app/menuva/id6756895068",
    beta:"https://testflight.apple.com/join/y6cwz9Qm",
    feedback:"https://docs.google.com/forms/d/e/1FAIpQLSeZRJYK2gEEBXD-C-Ub8LzEIjZXNjissO3IXiFIQ6J4z0_-WA/viewform"
  };
  var T={
    ar:"westwood",bb:"bluebell",cc:"claycroft & tocil",
    cv:"benefactors & cryfield",jm:"arthur vick & jack martin",
    ls:"heronbank & lakeside",rt:"rootes",sb:"sherbourne"
  };

  var MID='G-LLFDHVYBWL';

  var _denied=false;
  try{_denied=localStorage.getItem('analytics_consent')==='denied'}catch(_){}

  function loadGA(debug){
    if(_denied)return;
    var s=document.createElement('script');
    s.async=true;
    s.src='https://www.googletagmanager.com/gtag/js?id='+MID;
    document.head.appendChild(s);
    window.dataLayer=window.dataLayer||[];
    window.gtag=function(){dataLayer.push(arguments)};
    gtag('js',new Date());
    gtag('config',MID,{send_page_view:false,anonymize_ip:true,debug_mode:debug});
  }

  /* Lucide icon paths (inner SVG only) */
  var ICONS={
    compass:'<circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/>',
    ext:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
    q:'<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>'
  };

  function swapIcon(el,key){
    var svgDoc=new DOMParser().parseFromString(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">'+ICONS[key]+'</svg>',
      'image/svg+xml'
    );
    el.textContent='';
    el.appendChild(document.importNode(svgDoc.documentElement,true));
  }

  function formatUrl(u){
    if(!u)return '';
    return String(u).replace(/^https?:\/\//,'').replace(/\/$/,'');
  }

  function render(o){
    function go(){
      var card=document.getElementById('msg-card');
      if(card&&o.href)card.href=o.href;
      var ic=document.getElementById('msg-icon');
      if(ic&&o.icon)swapIcon(ic,o.icon);
      var t=document.getElementById('msg-title');
      if(t&&o.title)t.textContent=o.title;
      var d=document.getElementById('msg-sub');
      if(d)d.textContent=o.sub||'Redirecting\u2026';
      var sup=document.getElementById('msg-support');
      if(sup&&o.support)sup.classList.add('show');
    }
    if(document.body)go();
    else document.addEventListener('DOMContentLoaded',go,{once:true});
  }

  var dest=R[slug];

  if(dest!==undefined){
    /* --- Tier 2: Redirect slug --- */
    var ext=dest.indexOf('https://')===0;
    var params=new URLSearchParams(location.search);
    var debug=params.get('debug_mode')==='true';
    var title=T[slug]||slug;
    var toUrl;

    if(ext){
      toUrl=dest;
    }else{
      if(!params.has('qr_source'))params.set('qr_source',slug);
      if(!params.has('from'))params.set('from',slug);
      var u=new URL(dest,location.origin);
      u.search=params.toString();
      toUrl=u.toString();
    }

    document.title='menuva | '+title;

    var heading,iconKey;
    if(ext&&dest.indexOf('testflight')!==-1){
      heading='Opening TestFlight';iconKey='ext';
    }else if(ext&&dest.indexOf('apps.apple.com')!==-1){
      heading='Opening the App Store';iconKey='ext';
    }else if(ext){
      heading='Opening Link';iconKey='ext';
    }else{
      heading='Redirecting';iconKey='compass';
    }

    var subUrl=ext?dest:('menuva.co.uk'+dest);
    render({icon:iconKey,title:heading,sub:formatUrl(subUrl),href:ext?dest:toUrl});

    function doRedirect(){window.location.replace(toUrl)}

    if(_denied){doRedirect();return}

    loadGA(debug);

    gtag('event','page_view',{
      page_title:'menuva | '+title,
      page_location:location.href,
      page_path:'/'+slug
    });

    if(ext){
      gtag('event','redirect_hit',{
        transport_type:'beacon',
        event_callback:doRedirect,
        event_timeout:1200,
        from_path:params.get('from')?('/'+String(params.get('from')).replace(/^\/+/,'')):(''),
        to_url:toUrl,
        qr_source:params.get('qr_source')||'',
        qr_id:params.get('qr_id')||'',
        utm_source:params.get('utm_source')||'',
        utm_medium:params.get('utm_medium')||'',
        utm_campaign:params.get('utm_campaign')||'',
        referrer:document.referrer||''
      });
    }else{
      gtag('event','redirect_hit',{
        transport_type:'beacon',
        event_callback:doRedirect,
        event_timeout:1200,
        from_path:'/'+slug,
        to_path:dest,
        to_url:toUrl,
        qr_source:params.get('qr_source')||slug,
        qr_id:params.get('qr_id')||'',
        utm_source:params.get('utm_source')||'',
        utm_medium:params.get('utm_medium')||'',
        utm_campaign:params.get('utm_campaign')||'',
        referrer:document.referrer||''
      });
    }

    setTimeout(doRedirect,1200);
    return
  }

  /* --- Tier 3: Menu slug fallback (single path segment, no dots) --- */
  if(slug&&slug.indexOf('/')===-1&&slug.indexOf('.')===-1){
    location.replace('/menus/?slug='+encodeURIComponent(slug));
    return
  }

  /* --- Tier 4: True 404 --- */
  var params4=new URLSearchParams(location.search);
  var debug4=params4.get('debug_mode')==='true';

  document.title='menuva | 404';
  render({icon:'q',title:'Page Not Found',sub:'Redirecting\u2026',href:'/',support:true});

  function doRedirect4(){window.location.replace('/')}

  if(_denied){doRedirect4();return}

  loadGA(debug4);

  gtag('event','page_view',{
    page_title:'menuva | 404',
    page_location:location.href,
    page_path:p||'/'
  });

  gtag('event','not_found',{
    transport_type:'beacon',
    event_callback:doRedirect4,
    event_timeout:1200,
    from_path:p||location.pathname,
    to_path:'/',
    to_url:location.origin+'/',
    referrer:document.referrer||''
  });

  setTimeout(doRedirect4,1200);
})();
</script>
</head>
<body>
<main>
  <a id="msg-card" class="pcard" href="/">
    <div id="msg-icon" class="picon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/></svg></div>
    <div class="pinf">
      <div id="msg-title" class="pt">Redirecting</div>
      <div id="msg-sub" class="pd">Redirecting&hellip;</div>
    </div>
    <div class="arr"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></div>
  </a>
  <a id="msg-support" class="pcard support" href="mailto:support@menuva.co.uk">
    <div class="picon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg></div>
    <div class="pinf">
      <div class="pt">Contact Support</div>
      <div class="pd">support@menuva.co.uk</div>
    </div>
    <div class="arr"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></div>
  </a>
</main>
</body>
</html>
