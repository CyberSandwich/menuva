<!--
  REDIRECT PAGE TEMPLATE
  ======================
  Copy this file to {{SLUG}}/index.html and replace all {{PLACEHOLDER}} values.

  Placeholders:
    {{SLUG}}        — Directory name and FROM_SLUG value (e.g., "society", "ar")
    {{TITLE}}       — Text after "menuva — " in the title tag (e.g., "society", "westwood")
                      Usually same as SLUG. Differs for accommodation hubs (slug "ar", title "westwood").
    {{DEST_PATH}}   — Redirect destination path (e.g., "/download/" or "/")
    {{META_DESC}}   — Meta description (e.g., "Redirecting to download…" or "Redirecting to menuva.co.uk…")
    {{BODY_TEXT}}    — Visible text during redirect (e.g., "Opening download…" or "Redirecting…")
    {{FALLBACK_HREF}} — Fallback link href (e.g., "/download/" or "/")
    {{TO_PATH}}     — to_path value in redirect_hit event (e.g., "/download" or "/")

  Common configurations:
    Redirect to /download/ (→ App Store):
      DEST_PATH="/download/"  META_DESC="Redirecting to download…"  BODY_TEXT="Opening download…"
      FALLBACK_HREF="/download/"  TO_PATH="/download"

    Redirect to homepage (/):
      DEST_PATH="/"  META_DESC="Redirecting to menuva.co.uk…"  BODY_TEXT="Redirecting…"
      FALLBACK_HREF="/"  TO_PATH="/"

  Note: External URL redirects (/download/ → App Store, /beta/ → TestFlight) use a
  different pattern with a DEST constant. This template does not apply to those.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>menuva — {{TITLE}}</title>

  <meta name="description" content="{{META_DESC}}" />
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin>
  <link rel="preconnect" href="https://www.google-analytics.com" crossorigin>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LLFDHVYBWL"></script>
  <script>
    (function () {
      const MEASUREMENT_ID = "G-LLFDHVYBWL";
      const FROM_SLUG = "{{SLUG}}";
      const BASE_DELAY_MS = 1200;

      const params = new URLSearchParams(window.location.search);
      if (!params.has("qr_source")) params.set("qr_source", FROM_SLUG);
      if (!params.has("from")) params.set("from", FROM_SLUG);

      const toUrl = new URL("{{DEST_PATH}}", window.location.origin);
      toUrl.search = params.toString();

      const debugMode = params.get("debug_mode") === "true";

      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }

      gtag("js", new Date());
      gtag("config", MEASUREMENT_ID, {
        send_page_view: false,
        anonymize_ip: true,
        debug_mode: debugMode
      });

      function doRedirect() {
        window.location.replace(toUrl.toString());
      }

      function setFallbackHref() {
        const a = document.getElementById("fallbackLink");
        if (a) a.href = toUrl.toString();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", setFallbackHref, { once: true });
      } else {
        setFallbackHref();
      }

      gtag("event", "page_view", {
        page_title: "menuva — {{TITLE}}",
        page_location: window.location.href,
        page_path: "/{{SLUG}}"
      });

      gtag("event", "redirect_hit", {
        transport_type: "beacon",
        event_callback: doRedirect,
        event_timeout: BASE_DELAY_MS,

        from_path: "/{{SLUG}}",
        to_path: "{{TO_PATH}}",
        to_url: toUrl.toString(),

        qr_source: params.get("qr_source") || FROM_SLUG,
        qr_id: params.get("qr_id") || "",
        utm_source: params.get("utm_source") || "",
        utm_medium: params.get("utm_medium") || "",
        utm_campaign: params.get("utm_campaign") || "",
        referrer: document.referrer || ""
      });

      setTimeout(doRedirect, BASE_DELAY_MS);
    })();
  </script>

  <style>
    body{margin:0;padding:24px;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    .muted{opacity:.7}
  </style>
</head>
<body>
  <div>{{BODY_TEXT}}</div>
  <div class="muted">If you are not redirected, <a id="fallbackLink" href="{{FALLBACK_HREF}}">tap here</a></div>
</body>
</html>
