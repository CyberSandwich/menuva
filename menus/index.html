function _addBtnLabel(item,level,count){
  var name=resolveLang(item&&item.name)||'';
  if(level&&level!=='safe'){
    var prefix=level==='contains'?'containsYourRestriction':'mayContainYourRestriction';
    var fullKey=count>1?prefix+'s':prefix;
    return chrome(fullKey)+'. '+name;
  }
  return chrome('addToBasket')+' '+name;
}

function _setAddBtnAllergen(btn,level,count){
  btn.classList.remove('af-contains','af-may');
  var card=btn.closest&&btn.closest('.icard');
  var item=null;
  if(card){
    var idx=parseInt(card.getAttribute('data-item-idx'),10);
    if(!isNaN(idx))item=_viewerItems[idx];
  }
  if(!level||level==='safe'){
    btn.textContent='+';
    if(item)btn.setAttribute('aria-label',_addBtnLabel(item,null,0));
    return;
  }
  var prefix=level==='contains'?'containsYourRestriction':'mayContainYourRestriction';
  var fullKey=count>1?prefix+'s':prefix;
  btn.textContent=chrome(fullKey);
  btn.classList.add(level==='contains'?'af-contains':'af-may');
  if(item)btn.setAttribute('aria-label',_addBtnLabel(item,level,count));
}

function applyAllergenFilter(secContainer,pillsBar){
  var cards=[].slice.call(secContainer.querySelectorAll('.icard[data-item-idx]'));
  var secWraps=[].slice.call(secContainer.querySelectorAll('[data-sec-id]'));
  var hasFilters=_activeAllergens.size>0||_activeDietary.size>0;

  var vsInput=document.getElementById('vsearch');
  var searchActive=vsInput&&vsInput.value.trim().length>0;

  var prev=secContainer.querySelector('.afilter-empty');
  if(prev)prev.parentNode.removeChild(prev);

  if(!hasFilters){
    for(var i=0;i<cards.length;i++){
      var c=cards[i];
      c.removeAttribute('data-af-level');c.removeAttribute('data-af-count');
      if(!searchActive)c.style.display='';
      var addBtn=c.querySelector('.icard-add');
      if(addBtn)_setAddBtnAllergen(addBtn,null,0);
    }
    if(!searchActive){
      secWraps.forEach(function(s){s.style.display=''});
      pillsBar.style.display='';
    }
    return;
  }

  for(var i=0;i<cards.length;i++){
    var c=cards[i];
    if(searchActive&&c.style.display==='none')continue;

    var idx=parseInt(c.getAttribute('data-item-idx'),10);
    var item=_viewerItems[idx];
    if(!item){c.style.display='none';continue}

    var result=classifyItem(item,_activeAllergens,_activeDietary);
    var level=result?result.level:null;
    var count=result?result.count:0;

    c.setAttribute('data-af-level',level||'');
    c.setAttribute('data-af-count',count);

    if(!searchActive||c.style.display!=='none')c.style.display='';

    // Update add button (skip if stepper is showing)
    var addBtn=c.querySelector('.icard-add');
    if(addBtn)_setAddBtnAllergen(addBtn,level,count);
  }

  if(!searchActive){
    secWraps.forEach(function(s){
      var visItems=s.querySelectorAll('.icard[data-item-idx]');
      var hasVisible=false;
      for(var i=0;i<visItems.length;i++){
        if(visItems[i].style.display!=='none'){hasVisible=true;break}
      }
      s.style.display=hasVisible?'':'none';
    });
  }

  var totalVisible=0;
  for(var i=0;i<cards.length;i++){
    if(cards[i].style.display!=='none')totalVisible++;
  }
  if(totalVisible===0){
    var emptyEl=document.createElement('div');emptyEl.className='afilter-empty';
    var msg=document.createElement('p');msg.textContent=chrome('noFilterMatch');
    var clrBtn=document.createElement('button');clrBtn.textContent=chrome('resetFilters');
    clrBtn.addEventListener('click',function(){
      _userAllergens.clear();_userDietary.clear();
      _activeAllergens.clear();_activeDietary.clear();
      var bar=secContainer.parentNode.querySelector('.afilter-expand');
      if(bar){
        var pills=bar.querySelector('.afilter-pills');
        if(pills)_syncPillClasses(pills);
        var tog=bar.querySelector('.afilter-toggle');
        if(tog){var b=tog.querySelector('.afilter-count');if(b)tog.removeChild(b)}
      }
      applyAllergenFilter(secContainer,pillsBar);
    });
    emptyEl.appendChild(msg);emptyEl.appendChild(clrBtn);
    secContainer.appendChild(emptyEl);
  }
}

// ==================== BASKET ====================

var _basket=[];// Array of {item, selectedOptions:[{groupId,optionId,label,delta}], quantity, unitPrice, totalPrice}
var _bskFab=null;
var _bskLiveRegion=null;
var _bskBackdrop=null;
var _bskPanel=null;
var _bskPanelOpen=false;
var _bskPrevFocus=null;

// ---- Basket persistence (per venue) ----

function _bskStorageKey(){return viewerSlug?'bsk-v1:'+viewerSlug:''}
function _bskSave(){
  var k=_bskStorageKey();if(!k)return;
  try{
    if(_basket.length)localStorage.setItem(k,JSON.stringify(_basket));
    else localStorage.removeItem(k);
  }catch(_){}
}
function _bskLoad(){
  var k=_bskStorageKey();if(!k)return;
  try{
    var raw=localStorage.getItem(k);if(!raw)return;
    var arr=JSON.parse(raw);
    if(Array.isArray(arr))_basket=arr.filter(function(e){return e&&e.item&&e.item.id&&typeof e.quantity==='number'&&e.quantity>0});
  }catch(_){_basket=[]}
}

// ---- Basket data model ----

function _bskOptionKey(selOpts){
  return selOpts.map(function(o){return o.optionId}).sort().join(',');
}

function _bskFindDupe(item,selOpts){
  var key=_bskOptionKey(selOpts);
  for(var i=0;i<_basket.length;i++){
    if(_basket[i].item.id===item.id&&_bskOptionKey(_basket[i].selectedOptions)===key)return i;
  }
  return -1;
}

function addToBasket(item,selOpts,unitPrice){
  var idx=_bskFindDupe(item,selOpts);
  if(idx>=0){
    _basket[idx].quantity++;
    _basket[idx].totalPrice=_basket[idx].unitPrice*_basket[idx].quantity;
  }else{
    _basket.push({item:item,selectedOptions:selOpts,quantity:1,unitPrice:unitPrice,totalPrice:unitPrice});
  }
  _ga('add_to_cart',{currency:_viewerCurrency,value:unitPrice/100,items:[{item_id:item.id,item_name:resolveLang(item.name)||'',price:unitPrice/100}]});
  _bskSave();
  _bskUpdateFab();
  _bskUpdateBadges();
  _bskPulseFab();
  _bskAnnounce(_bskSummaryMsg());
}

function removeFromBasket(idx){
  if(idx>=0&&idx<_basket.length){
    var entry=_basket[idx];
    if(entry)_ga('remove_from_cart',{currency:_viewerCurrency,value:entry.unitPrice/100,items:[{item_id:entry.item.id,item_name:resolveLang(entry.item.name)||'',price:entry.unitPrice/100}]});
    _basket.splice(idx,1);
  }
  _bskSave();
  _bskUpdateFab();
  _bskUpdateBadges();
  if(!_basket.length)_bskClosePanel();
  _bskAnnounce(_bskSummaryMsg());
}

function updateBasketQty(idx,delta){
  if(idx<0||idx>=_basket.length)return;
  _basket[idx].quantity+=delta;
  if(_basket[idx].quantity<=0){removeFromBasket(idx);return}
  _basket[idx].totalPrice=_basket[idx].unitPrice*_basket[idx].quantity;
  _bskSave();
  _bskUpdateFab();
  _bskUpdateBadges();
  _bskRenderList();
  _bskAnnounce(_bskSummaryMsg());
}

function clearBasket(){
  _ga('basket_cleared',{basket_count:basketItemCount(),total_price_minor:basketTotal(),restaurant_slug:viewerSlug});
  _basket=[];
  _bskSave();
  _bskUpdateFab();
  _bskUpdateBadges();
  _bskClosePanel();
  _bskAnnounce(chrome('basket')+': 0');
}

function basketTotal(){
  var t=0;
  for(var i=0;i<_basket.length;i++)t+=_basket[i].totalPrice;
  return t;
}

function basketItemCount(){
  var c=0;
  for(var i=0;i<_basket.length;i++)c+=_basket[i].quantity;
  return c;
}

// ---- Collect selections from cpanel ----

function _bskAddFromPanel(){
  if(!_cpItem)return;
  var selOpts=[];
  var custs=_cpItem.customizations||[];
  for(var gi=0;gi<custs.length;gi++){
    var group=custs[gi];
    if(!group||!group.options)continue;
    var gid=group.id||group.key;
    var sel=_cpSelections[gid];
    if(!sel||!sel.size)continue;
    for(var oi=0;oi<group.options.length;oi++){
      var opt=group.options[oi];
      if(sel.has(opt.id)){
        selOpts.push({groupId:gid,optionId:opt.id,label:resolveLang(opt.label)||'',labelObj:opt.label,delta:opt.priceDeltaMinor||0});
      }
    }
  }
  var unitPrice=_cpComputeTotal();
  addToBasket(_cpItem,selOpts,unitPrice);
}

// ---- FAB ----

function _bskCreateFab(){
  _bskFab=document.createElement('button');
  _bskFab.className='bsk-nav';
  _bskFab.setAttribute('aria-label','Basket');
  _bskFab.addEventListener('click',function(e){
    e.stopPropagation();
    _bskOpenPanel();
  });
  // Append to right tabs group (alongside language toggle)
  var navRight=document.querySelector('nav .tabs:last-child');
  if(navRight){
    navRight.appendChild(_bskFab);
    _bskLiveRegion=document.createElement('span');
    _bskLiveRegion.id='bsk-live';
    _bskLiveRegion.setAttribute('aria-live','polite');
    _bskLiveRegion.setAttribute('aria-atomic','true');
    _bskLiveRegion.setAttribute('style','position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap');
    navRight.appendChild(_bskLiveRegion);
  }
}

function _bskAnnounce(msg){
  if(!_bskLiveRegion)return;
  _bskLiveRegion.textContent='';
  setTimeout(function(){
    if(_bskLiveRegion)_bskLiveRegion.textContent=msg;
  },100);
}

function _bskSummaryMsg(){
  var label=chrome('basket');
  var count=basketItemCount();
  if(!count)return label+': 0';
  var price=formatPrice(basketTotal(),_viewerCurrency);
  return price?label+': '+count+', '+price:label+': '+count;
}

function _bskUpdateFab(){
  if(!_bskFab)return;
  if(!_basket.length){
    _bskFab.classList.remove('bsk-show');
    return;
  }
  _bskFab.classList.add('bsk-show');
  var total=basketTotal();
  var txt=formatPrice(total,_viewerCurrency);
  if(!txt||txt.length>8)txt=chrome('basket')+' ('+basketItemCount()+')';
  _bskFab.textContent=txt;
}

function _bskPulseFab(){
  if(!_bskFab||typeof _bskFab.animate!=='function')return;
  _bskFab.animate([
    {transform:'scale(1)'},{transform:'scale(1.1)'},{transform:'scale(1)'}
  ],{duration:300,easing:'ease-out'});
}

function _bskItemQty(itemId){
  var q=0;
  for(var i=0;i<_basket.length;i++){
    if(_basket[i].item.id===itemId)q+=_basket[i].quantity;

  return q;

function _bskMakeStepper(card,item,qty){
  var stepper=document.createElement('div');stepper.className='icard-stepper';
  var qtyEl=document.createElement('div');qtyEl.className='icard-stepper-qty';qtyEl.textContent=qty;
  var minus=document.createElement('button');minus.className='icard-stepper-minus';
  minus.textContent='\u2212';minus.setAttribute('aria-label',chrome('decreaseQty').replace('{name}',resolveLang(item.name)||''));
  minus.addEventListener('click',function(e){
    e.stopPropagation();
    var bIdx=_bskFindByItemId(item.id);
    if(bIdx>=0)updateBasketQty(bIdx,-1);
  });
  var plus=document.createElement('button');plus.className='icard-stepper-plus';
  plus.textContent='+';plus.setAttribute('aria-label',chrome('increaseQty').replace('{name}',resolveLang(item.name)||''));
  plus.addEventListener('click',function(e){
    e.stopPropagation();
    if(item.customizations&&item.customizations.length){
      openCPanel(item,_viewerCurrency);
    }else{
      addToBasket(item,[],item.price?item.price.amountMinor:0);
    }
  });
  stepper.appendChild(minus);stepper.appendChild(qtyEl);stepper.appendChild(plus);
  return stepper;
}

function _bskFindByItemId(itemId){
  for(var i=0;i<_basket.length;i++){
    if(_basket[i].item.id===itemId)return i;
  }
  return -1;
}

function _bskUpdateBadges(){
  var cards=document.querySelectorAll('.icard[data-item-idx]');
  for(var i=0;i<cards.length;i++){
    var idx=parseInt(cards[i].getAttribute('data-item-idx'),10);
    var item=_viewerItems[idx];
    if(!item)continue;
    var q=_bskItemQty(item.id);
    var oldStepper=cards[i].querySelector('.icard-stepper');
    var oldAdd=cards[i].querySelector('.icard-add');

    if(q>0){
      if(oldStepper){
        var qtyEl=oldStepper.querySelector('.icard-stepper-qty');
        if(qtyEl)qtyEl.textContent=q;
      }else{
        var stepper=_bskMakeStepper(cards[i],item,q);
        if(oldAdd)cards[i].replaceChild(stepper,oldAdd);
        else cards[i].appendChild(stepper);
      }
    }else{
      if(oldStepper){
        var addBtn=_bskMakeAddBtn(cards[i],item);
        cards[i].replaceChild(addBtn,oldStepper);
      }
    }
  }
}

// ---- Basket panel ----

function _bskMakeCloseSvg(){
  var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('fill','none');
  svg.setAttribute('stroke','currentColor');svg.setAttribute('stroke-width','2');
  svg.setAttribute('stroke-linecap','round');svg.setAttribute('stroke-linejoin','round');
  svg.setAttribute('aria-hidden','true');
  var p1=document.createElementNS('http://www.w3.org/2000/svg','path');p1.setAttribute('d','M18 6L6 18');
  var p2=document.createElementNS('http://www.w3.org/2000/svg','path');p2.setAttribute('d','M6 6l12 12');
  svg.appendChild(p1);svg.appendChild(p2);
  return svg;
}

function _bskCreatePanel(){
  _bskBackdrop=document.createElement('div');_bskBackdrop.className='bsk-backdrop';
  _bskPanel=document.createElement('div');_bskPanel.className='bsk-panel';
  _bskPanel.setAttribute('role','dialog');_bskPanel.setAttribute('aria-modal','true');
  _bskBackdrop.appendChild(_bskPanel);
  document.body.appendChild(_bskBackdrop);

  // Close on backdrop click
  _bskBackdrop.addEventListener('click',function(e){
    if(e.target===_bskBackdrop)_bskClosePanel();
  });

  // Keyboard
  _bskPanel.addEventListener('keydown',function(e){
    if(e.key==='Escape'){e.preventDefault();_bskClosePanel()}
    if(e.key==='Tab'){
      var focusable=_bskPanel.querySelectorAll('button,input,[tabindex]:not([tabindex="-1"])');
      if(!focusable.length)return;
      var first=focusable[0],last=focusable[focusable.length-1];
      if(e.shiftKey){if(document.activeElement===first){e.preventDefault();last.focus()}}
      else{if(document.activeElement===last){e.preventDefault();first.focus()}}
    }
  });

  // Swipe down to close
  var startY=0,curY=0,dragging=false;
  var _bskRmq=matchMedia('(prefers-reduced-motion:reduce)');
  _bskPanel.addEventListener('touchstart',function(e){
    var list=_bskPanel.querySelector('.bsk-list');
    if(list&&list.scrollTop>0)return;
    var t=e.touches[0];startY=t.clientY;curY=startY;dragging=true;
  },{passive:true});
  _bskPanel.addEventListener('touchmove',function(e){
    if(!dragging||!_bskPanelOpen)return;
    var t=e.touches[0];curY=t.clientY;
    var dy=curY-startY;
    if(dy>0&&!_bskRmq.matches){_bskPanel.style.transition='none';_bskPanel.style.transform='translateY('+dy+'px)'}
  },{passive:true});
  _bskPanel.addEventListener('touchend',function(){
    if(!dragging)return;dragging=false;
    _bskPanel.style.transition='';
    if(curY-startY>80){_bskClosePanel()}
    else{_bskPanel.style.transform='';if(_bskPanelOpen)_bskPanel.classList.add('open')}
  },{passive:true});
}

function _bskBuildPanelDOM(){
  _bskPanel.textContent='';

  // Handle
  var handle=document.createElement('div');handle.className='bsk-handle';
  _bskPanel.appendChild(handle);

  // Header
  var hdr=document.createElement('div');hdr.className='bsk-hdr';
  var title=document.createElement('div');title.className='bsk-title';
  title.textContent=chrome('basket');
  hdr.appendChild(title);

  var clearBtn=document.createElement('button');clearBtn.className='bsk-clear';
  clearBtn.textContent=chrome('clearAll');
  var confirming=false,tmr=0;
  clearBtn._resetConfirm=function(){if(tmr){clearTimeout(tmr);tmr=0}confirming=false;clearBtn.textContent=chrome('clearAll')};
  clearBtn.addEventListener('click',function(){
    if(confirming){clearBtn._resetConfirm();clearBasket();return}
    confirming=true;clearBtn.textContent=chrome('confirmClear');
    tmr=setTimeout(function(){confirming=false;tmr=0;clearBtn.textContent=chrome('clearAll')},3000);
  });
  hdr.appendChild(clearBtn);

  var closeBtn=document.createElement('button');closeBtn.className='bsk-close';
  closeBtn.setAttribute('aria-label','Close');
  closeBtn.appendChild(_bskMakeCloseSvg());
  closeBtn.addEventListener('click',_bskClosePanel);
  hdr.appendChild(closeBtn);
  _bskPanel.appendChild(hdr);

  // List
  var list=document.createElement('div');list.className='bsk-list';
  _bskPanel.appendChild(list);

  // Footer
  var foot=document.createElement('div');foot.className='bsk-foot';
  var totalRow=document.createElement('div');totalRow.className='bsk-total';
  var totalLabel=document.createElement('span');totalLabel.textContent=chrome('total');
  var totalVal=document.createElement('span');totalVal.className='bsk-total-val';
  totalRow.appendChild(totalLabel);totalRow.appendChild(totalVal);
  foot.appendChild(totalRow);
  if(!localStorage.getItem('bsk-banner-dismissed')){
    var banner=document.createElement('div');banner.className='bsk-banner';
    var bTitle=document.createElement('div');bTitle.className='bsk-banner-title';bTitle.textContent=chrome('basketBannerTitle');
    var bBody=document.createElement('div');bBody.className='bsk-banner-body';bBody.textContent=chrome('basketBannerBody');
    var bDismiss=document.createElement('button');bDismiss.className='bsk-banner-dismiss';bDismiss.textContent=chrome('basketDismiss');
    bDismiss.addEventListener('click',function(){localStorage.setItem('bsk-banner-dismissed','1');banner.remove()});
    banner.appendChild(bTitle);banner.appendChild(bBody);banner.appendChild(bDismiss);
    foot.appendChild(banner);
  }
  var langToggle=document.createElement('button');langToggle.className='bsk-lang-toggle';
  langToggle.textContent=chrome('showOther');
  langToggle.addEventListener('click',function(){var lb=document.getElementById('lang-btn');if(lb)lb.click()});
  foot.appendChild(langToggle);
  _bskPanel.appendChild(foot);

  _bskRenderList();
}

function _bskRenderList(){
  var list=_bskPanel?_bskPanel.querySelector('.bsk-list'):null;
  if(!list)return;
  list.textContent='';

  for(var i=0;i<_basket.length;i++){
    (function(idx){
      var entry=_basket[idx];
      var row=document.createElement('div');row.className='bsk-row';

      // Info
      var info=document.createElement('div');info.className='bsk-row-info';
      var name=document.createElement('div');name.className='bsk-row-name';
      name.textContent=resolveLang(entry.item.name)||'';
      info.appendChild(name);
      if(entry.selectedOptions.length){
        var opts=document.createElement('div');opts.className='bsk-row-opts';
        for(var j=0;j<entry.selectedOptions.length;j++){
          var o=entry.selectedOptions[j];
          var optEl=document.createElement('div');optEl.className='bsk-row-opt';
          optEl.appendChild(document.createTextNode((o.labelObj?resolveLang(o.labelObj):null)||o.label));
          if(o.delta){var pr=document.createElement('span');pr.className='bsk-row-opt-price';pr.textContent=(o.delta>0?'+':'')+formatPrice(o.delta,_viewerCurrency);optEl.appendChild(pr)}
          opts.appendChild(optEl);
        }
        info.appendChild(opts);
      }
      row.appendChild(info);

      // Quantity stepper
      var qty=document.createElement('div');qty.className='bsk-qty';
      var minus=document.createElement('button');minus.className='bsk-minus';
      minus.textContent='\u2212';minus.setAttribute('aria-label',chrome('decreaseQty').replace('{name}',resolveLang(entry.item.name)||''));
      minus.addEventListener('click',function(){updateBasketQty(idx,-1)});
      var val=document.createElement('div');val.className='bsk-qty-val';val.textContent=entry.quantity;val.setAttribute('aria-hidden','true');
      var plus=document.createElement('button');plus.className='bsk-plus';
      plus.textContent='+';plus.setAttribute('aria-label',chrome('increaseQty').replace('{name}',resolveLang(entry.item.name)||''));
      plus.addEventListener('click',function(){updateBasketQty(idx,1)});
      qty.appendChild(minus);qty.appendChild(val);qty.appendChild(plus);
      row.appendChild(qty);

      // Line price
      var price=document.createElement('span');price.className='bsk-row-price';
      price.textContent=formatPrice(entry.totalPrice,_viewerCurrency);
      row.appendChild(price);

      list.appendChild(row);
    })(i);
  }

  // Update total
  var totalVal=_bskPanel.querySelector('.bsk-total-val');
  if(totalVal)totalVal.textContent=formatPrice(basketTotal(),_viewerCurrency);
}

function _bskOpenPanel(){
  if(_bskPanelOpen||!_basket.length)return;
  _bskPanel.setAttribute('aria-label',chrome('basket'));
  _bskPrevFocus=document.activeElement;
  _bskPanelOpen=true;
  _ga('view_cart',{currency:_viewerCurrency,value:basketTotal()/100,items:_basket.map(function(b){return{item_id:b.item.id,item_name:resolveLang(b.item.name)||'',price:b.unitPrice/100,quantity:b.quantity}})});
  _bskBuildPanelDOM();
  document.body.style.overflow='hidden';
  _bskBackdrop.classList.add('open');
  _bskPanel.offsetHeight;
  _bskPanel.classList.add('open');
  var closeBtn=_bskPanel.querySelector('.bsk-close');
  if(closeBtn)setTimeout(function(){closeBtn.focus()},50);
}

function _bskClosePanel(){
  if(!_bskPanelOpen)return;
  if(_bskPanel){var cb=_bskPanel.querySelector('.bsk-clear');if(cb&&cb._resetConfirm)cb._resetConfirm();}
  _bskPanelOpen=false;
  _bskPanel.style.transition='';
  _bskPanel.style.transform='';
  _bskPanel.classList.remove('open');
  _bskBackdrop.classList.remove('open');
  document.body.style.overflow='';
  if(_bskPrevFocus){try{_bskPrevFocus.focus()}catch(_){}_bskPrevFocus=null}
}

// Initialize basket DOM (only in viewer mode)
if(isViewer){
  _bskLoad();
  _bskCreateFab();
  _bskCreatePanel();
  _bskUpdateFab();
}

// ==================== ANALYTICS ====================
function _ga(name,params){try{if(window.gtag)window.gtag('event',name,params||{})}catch(_){}}

var _scrollFired={};
function _trackScroll(){
  var docH=document.documentElement.scrollHeight-window.innerHeight;
  if(docH<=0)return;
  var pct=Math.round(window.scrollY/docH*100);
  var thresholds=[25,50,75,100];
  for(var i=0;i<thresholds.length;i++){
    var t=thresholds[i];
    if(pct>=t&&!_scrollFired[t]){
      _scrollFired[t]=true;
      _ga('menu_scroll_depth',{percent_reached:t,restaurant_slug:viewerSlug||''});
    }
  }
}
window.addEventListener('scroll',_trackScroll,{passive:true});

window.addEventListener('online',function(){
  var b=document.getElementById('offline-bar');
  if(b)b.parentNode.removeChild(b);
});
window.addEventListener('offline',function(){
  if(document.getElementById('offline-bar'))return;
  var b=document.createElement('div');b.id='offline-bar';
  b.setAttribute('role','alert');
  b.style.cssText='position:fixed;top:0;left:0;right:0;padding:8px;background:var(--warning);color:#fff;text-align:center;font:500 .8125rem/1 var(--font);z-index:200';
  b.textContent=chrome('offline');
  document.body.appendChild(b);
});

document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  if(isViewer&&window._menuData){
    var vc=_readCache(viewerSlug);
    if(vc)_revalidate(viewerSlug,vc.sha).then(function(fresh){
      if(!fresh)return;
      window._menuData=fresh.menu;window._menuDoc=fresh.doc;
      var el=$('#menu-view');
      if(el){renderMenu(el,fresh.menu,fresh.doc);_injectJsonLd(fresh.menu,fresh.doc)}
    });
  }else if(!isViewer&&menuCache){
    if(_listCacheAge()>5*60*1000){
      window._acReady.then(function(){
        return window._db.collection('menus').get({source:'server'});
      }).then(function(snap){
        var docs=snap.docs.map(function(d){return d.data()}).filter(function(f){return f.slug});
        _writeListCache(docs);
        if(JSON.stringify(docs)!==JSON.stringify(_lastCachedRaw)){
          _rawDocs=docs;menuCache=flattenDocs(docs);
          var el=$('#mlist');
          if(el&&!isViewer)_swrUpdateList(el,menuCache);
          _lastCachedRaw=docs;
        }
      }).catch(function(){});
    }
  }
},{passive:true});

var cmd = initCommandPalette({
  buildItems:function(){
    var items=[];
    function add(title,sub,type,act){items.push({q:(title+' '+(sub||'')).toLowerCase(),tl:title.toLowerCase(),title:title,type:type,act:act})}
    add(chrome('home'),'','Page',function(){location.href='/'});
    add(chrome('menus'),'','Page',function(){window.scrollTo(0,0)});
    add(chrome('more'),'','Page',function(){location.href='/more/'});
    if(menuCache){menuCache.forEach(function(x){
      add(menuDisplayTitle(x),'','Menu',function(){location.href='/menus/'+x.slug+(x.locId?'/'+x.locId:'')});
    });}
    if(isViewer&&_viewerItems.length){
      for(var vi=0;vi<_viewerItems.length;vi++){
        (function(item){
          var n=resolveLang(item.name)||'';
          if(n)add(n,'','Item',function(){
            var card=document.querySelector('.icard[data-item-idx="'+_viewerItems.indexOf(item)+'"]');
            if(card){card.scrollIntoView({behavior:'smooth',block:'center'});card.click()}
          });
        })(_viewerItems[vi]);
      }
    }
    return items;
  },

  maxResults:8
});

    var si=document.querySelector('#msearch');
    if(si){si.placeholder=chrome('searchMenus');si.setAttribute('aria-label',chrome('searchMenus'))}

    var rt=document.getElementById('rc-terms');if(rt)rt.textContent=chrome('recaptchaTerms');

var menuTitle=document.querySelector('.stitle');
if(menuTitle){

}

initKeyboard({

    if(_cpOpen){if(e.key==='Escape')closeCPanel();return true}

  },
  onKey:function(key,e){return false}
});
