<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <meta http-equiv="refresh" content="0;url=https://apps.apple.com/app/menuva/id6756895068">
  <script>
    (function () {
      var target = "https://apps.apple.com/app/menuva/id6756895068";
      if (window.location.href !== target) {
        window.location.replace(target);
      }
    })();
  </script>
</head>
<body>
  <noscript>
    <p>
      If you are not redirected,
      <a href="https://apps.apple.com/app/menuva/id6756895068">
        click here
      </a>.
    </p>
  </noscript>
</body>
</html>
